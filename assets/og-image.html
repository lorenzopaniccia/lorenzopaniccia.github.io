<!DOCTYPE html>
<!--
  Sorgente della social preview (assets/og-image.png, 1200x630).
  Per rigenerare il PNG dopo una modifica, da PowerShell nella cartella del sito:

  & "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=10000 --screenshot="$PWD\assets\og-image.png" "file:///$($PWD -replace '\\','/')/assets/og-image.html"
-->
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>og-image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14171a;
      --bg-alt: #191d1a;
      --text: #e8e6df;
      --text-muted: #8b9490;
      --border: #2c312d;
      --accent: #7fffa0;
      --accent2: #f2b544;
      --dot: #5b6461;
    }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }

    .window {
      position: absolute;
      left: 60px;
      top: 60px;
      width: 1080px;
      height: 510px;
      box-sizing: border-box;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .titlebar {
      height: 58px;
      box-sizing: border-box;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 26px;
      color: var(--text-muted);
      font-size: 22px;
    }

    .dots {
      display: flex;
      gap: 12px;
    }

    .dots span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--dot);
    }

    .content {
      position: absolute;
      left: 55px;
      top: 105px;
    }

    .prompt {
      color: var(--accent);
      font-size: 22px;
      font-weight: 500;
      margin: 0 0 18px;
    }

    .prompt::before {
      content: "> ";
    }

    h1 {
      margin: 0 0 24px;
      font-size: 76px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    h1 .cursor {
      display: inline-block;
      width: 30px;
      height: 64px;
      background: var(--accent);
      margin-left: 20px;
      vertical-align: -6px;
    }

    .tagline {
      margin: 0;
      font-size: 30px;
      font-weight: 500;
      color: var(--accent2);
      white-space: nowrap;
    }

    .tagline::before {
      content: "// ";
    }

    .subline {
      margin: 10px 0 0 56px;
      font-size: 26px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .footer {
      position: absolute;
      left: 55px;
      bottom: 42px;
      margin: 0;
      font-size: 22px;
      color: var(--text-muted);
    }

    .footer::before {
      content: "$ ";
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span>~/lorenzopaniccia</span>
    </div>
    <div class="content">
      <p class="prompt">whoami</p>
      <h1>Lorenzo Paniccia<span class="cursor"></span></h1>
      <p class="tagline">Full Stack Developer &amp; AI Integrator</p>
      <p class="subline">prodotti web end-to-end e sistemi basati su AI</p>
    </div>
    <p class="footer">lorenzopaniccia.github.io</p>
  </div>
</body>
</html>
